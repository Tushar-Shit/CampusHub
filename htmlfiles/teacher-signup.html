<html lang="en">

    <title>teacher signup</title>
    <link rel="stylesheet" href="/css/teacher-signup.css" />
  </head>

  <body>
    <form id="edit-popup" class="state-hide">
      <div id="main-edit-container">
        <i class="fa-solid fa-xmark" id="cross-btn"></i>
        <h1 id="form-heading">Teacher Login</h1>
        <!-- <br /> -->

        <div class="field-container same-style">
          <label for="edit-name">Name</label>
          <input type="text" id="edit-name" required />
        </div>
        <div class="field-container same-style">
          <label for="edit-designation">Designation</label>
          <input type="text" id="edit-designation" required />
        </div>
        <div class="same-style login">
          <label for="edit-email">E-mail</label>
          <input type="email" id="edit-email" required />
        </div>
        <div class="same-style login">
          <label for="edit-email">Password</label>
          <input type="password" id="edit-password" required />
        </div>
        <div class="field-container same-style">
          <label for="edit-ph-no">Mobile No.</label>
          <input type="text" id="edit-ph-no" />
        </div>
        <div class="field-container same-style">
          <label>Department</label>
          <div class="radio-options">
            <input
              type="radio"
              name="edit-dept"
              value="Bachelor Of Computer Application (BCA)"
              id="dept-bca"
              required
            />
            <label for="dept-bca" class="radio-label">BCA</label>

            <input
              type="radio"
              name="edit-dept"
              value="Bachelor Of Business Administration(BBA)"
              id="dept-bba"
            />
            <label for="dept-bba" class="radio-label">BBA</label>

            <input
              type="radio"
              name="edit-dept"
              value=" Bachelor Of Hospital Management(BHM)"
              id="dept-bhm"
            />
            <label for="dept-bhm" class="radio-label">BHM</label>

            <input
              type="radio"
              name="edit-dept"
              value=" Bachelor Of Medical Laboratory Technology(BMLT)"
              id="dept-bmlt"
              required
            />
            <label for="dept-bmlt" class="radio-label">BMLT</label>
          </div>
        </div>
        <button id="edit-save">Login</button>
        <p id="below-text"> <span id="change-state"></span></p>
      </div>
      <a href="index.html">previous</a>
      <a href="teacher-home.html">next</a>
    </form>

    <script src="/js/teacher-signup.js"></script>
  </body>
</html>
