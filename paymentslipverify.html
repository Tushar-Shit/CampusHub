<!DOCTYPE html>
<html>

<head>
    <title>Student Verification</title>
    <script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
</head>

<body>

    <h2>Upload Receipt / ID Slip</h2>

    <input type="file" id="imageInput" accept="image/*">
    <br><br>

    <img id="preview" width="250"><br><br>

    <progress id="progressBar" value="0" max="100" style="width:250px;"></progress>
    <p id="progressText"></p>

    <p id="result"></p>

    <button id="signupBtn" style="display:none;">
        Continue to Signup Form
    </button>

    <script>
        const input = document.getElementById("imageInput");
        const preview = document.getElementById("preview");
        const result = document.getElementById("result");
        const signupBtn = document.getElementById("signupBtn");
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");

        input.addEventListener("change", function () {

            const file = input.files[0];
            if (!file) return;

            preview.src = URL.createObjectURL(file);

            result.innerText = "Checking slip...";
            signupBtn.style.display = "none";
            progressBar.value = 0;
            progressText.innerText = "Running OCR...";

            Tesseract.recognize(file, "eng", {
                logger: m => {
                    if (m.status === "recognizing text") {
                        let percent = Math.floor(m.progress * 100);
                        progressBar.value = percent;
                        progressText.innerText =
                            "Processing: " + percent + "%";
                    }
                }
            }).then(({ data: { text } }) => {

                let detectedText = text.toLowerCase();

                let hasInstitute = detectedText.includes(
                    "management institute of durgapur"
                );

                let hasReceipt =
                    detectedText.includes("rajbandh") &&
                    detectedText.includes("voucher");

                if (hasInstitute && hasReceipt) {
                    result.innerText = "✅ Verified Receipt Voucher";
                    signupBtn.style.display = "block";
                } else {
                    result.innerText = "❌ Invalid Slip";
                }

                progressText.innerText = "Completed";
            });

        });
    </script>

</body>

</html>
