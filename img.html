<!DOCTYPE html>
<html>
<head>
<title>Student Verification</title>
<script src="https://unpkg.com/tesseract.js@v5.0.0/dist/tesseract.min.js"></script>
</head>

<body>

<h2>Upload Receipt / ID Slip</h2>

<input type="file" id="imageInput" accept="image/*">
<br><br>

<img id="preview" width="250"><br><br>

<progress id="progressBar" value="0" max="100" style="width:250px;"></progress>
<p id="progressText"></p>

<p id="result"></p>

<button id="signupBtn" style="display:none;">
    Continue to Signup Form
</button>

<!-- Hidden canvas -->
<canvas id="canvas" style="display:none;"></canvas>

<script>
const input = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const result = document.getElementById("result");
const signupBtn = document.getElementById("signupBtn");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

input.addEventListener("change", function () {

    const file = input.files[0];
    if (!file) return;

    preview.src = URL.createObjectURL(file);

    result.innerText = "Checking slip...";
    signupBtn.style.display = "none";
    progressBar.value = 0;
    progressText.innerText = "Preparing image...";

    const img = new Image();

    img.onload = () => {

        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;

        let minX = canvas.width, minY = canvas.height;
        let maxX = 0, maxY = 0;

        // Detect white slip
        for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {

                let i = (y * canvas.width + x) * 4;
                let r = pixels[i];
                let g = pixels[i + 1];
                let b = pixels[i + 2];

                if (r > 200 && g > 200 && b > 200) {
                    minX = Math.min(minX, x);
                    minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x);
                    maxY = Math.max(maxY, y);
                }
            }
        }

        let w = maxX - minX;
        let h = maxY - minY;

        let cropped = ctx.getImageData(minX, minY, w, h);

        canvas.width = w;
        canvas.height = h;
        ctx.putImageData(cropped, 0, 0);

        preview.src = canvas.toDataURL();

        progressText.innerText = "Running OCR...";

        // OCR
        Tesseract.recognize(canvas, "eng", {
            logger: m => {
                if (m.status === "recognizing text") {
                    let percent = Math.floor(m.progress * 100);
                    progressBar.value = percent;
                    progressText.innerText =
                        "Processing: " + percent + "%";
                }
            }
        }).then(({ data: { text } }) => {

            console.log("Detected Text:");
            console.log(text);

            let detectedText = text.toLowerCase();

            let hasInstitute = detectedText.includes(
                "management institute of durgapur"
            );

            let hasReceipt =
                detectedText.includes("receipt") ||
                detectedText.includes("voucher");

            if (hasInstitute && hasReceipt) {
                result.innerText =
                    "✅ Verified Receipt Voucher";
                signupBtn.style.display = "block";
            } else {
                result.innerText = "❌ Invalid Slip";
            }

            progressText.innerText = "Completed";
        });
    };

    img.src = URL.createObjectURL(file);
});
</script>

</body>
</html>
