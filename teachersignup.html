<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teacher signup</title>
    <style>
        #edit-popup {
            display: block;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.521);
            align-content: center;
            z-index: 10;
        }

        #main-edit-container {
            width: 25vw;
            justify-self: center;
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #cross-btn {
            position: relative;
            top: -2vh;
            left: 20vw;
            color: #666;
            font-size: 1.8rem;
        }

        #cross-btn:hover {
            color: #ff4d4d;
        }


        .field-container {
            display: flex;
            flex-direction: column;
        }

        .field-container label {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .field-container input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }

        .field-container input:focus {
            border-color: #ff0048;
            box-shadow: 0 0 0 2px rgba(255, 0, 0, 0.25);
        }

        .field-container {
            margin-bottom: 2vh;
            display: flex;
            flex-direction: column;
        }

        .field-container label {
            font-weight: 500;
            margin-right: 15px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .field-container input[type="radio"] {
            margin-right: 6px;
            cursor: pointer;
            box-shadow: none;
            accent-color: #ff0400;
        }

        #edit-save {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        #edit-save:hover {
            background-color: #006417;

        }
    </style>
</head>

<body>
    <form id="edit-popup" class=" state-hide">
        <div id="main-edit-container">
            <i class="fa-solid fa-xmark" id="cross-btn"></i>
            <br>

            <div class="field-container">
                <label for="edit-name">Name</label>
                <input type="text" id="edit-name" required>
            </div>
            <div class="field-container">
                <label for="edit-designation">Designation</label>
                <input type="text" id="edit-designation" required>
            </div>
            <div class="field-container">
                <label for="edit-email">E-mail</label>
                <input type="email" id="edit-email" required>
            </div>
            <div class="field-container">
                <label for="edit-ph-no">Mobile No.</label>
                <input type="text" id="edit-ph-no" required>
            </div>
            <div class="field-container">
                <label>Department</label>
                <div class="radio-options">
                    <input type="radio" name="edit-dept" value="Bachelor Of Computer Application (BCA)" id="dept-bca" required>
                    <label for="dept-bca">BCA</label>

                    <input type="radio" name="edit-dept" value="Bachelor Of Business Administration(BBA)" id="dept-bba">
                    <label for="dept-bba">BBA</label>

                    <input type="radio" name="edit-dept" value=" Bachelor Of Hospital Management(BHM)" id="dept-bhm">
                    <label for="dept-bhm">BHM</label>

                    <input type="radio" name="edit-dept" value=" Bachelor Of Medical Laboratory Technology(BMLT)" id="dept-bmlt" required>
                    <label for="dept-bmlt">BMLT</label>
                </div>
            </div>
            <input type="submit" id="edit-save">
        </div>
    </form>
    <script src="signuplogic.js"></script>
</body>

</html>
