<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/attendence.css">
    <script src="../js/common.js"></script>
</head>

<body>

    <div class="container">
        <header>
            <h1 id="heading">Select Dept & sem</h1>
            <p>Date: <span id="current-date">March 21, 2026</span></p>
        </header>

        <section class="filters">
            <div class="select-group">
                <label for="course">Course</label>
                <select id="course">
                    <option value="Select Department">Select Department</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="BHM">BHM</option>
                    <option value="BMLT">BMLT</option>
                </select>
            </div>

            <div class="select-group">
                <label for="semester">Semester</label>
                <select id="semester">
                    <option value="Select Semester">Select Semester</option>
                    <option value="I">1st Semester</option>
                    <option value="II">2nd Semester</option>
                    <option value="III">3rd Semester</option>
                    <option value="IV">4th Semester</option>
                    <option value="V">5th Semester</option>
                    <option value="VI">6th Semester</option>
                    <option value="VII">7th Semester</option>
                    <option value="VIII">8th Semester</option>
                </select>
            </div>
        </section>

        <section class="extra-data">
            <div>Attendance was taken by <b>
                    <p id="teacher" style="display:inline-block; color: rgb(0, 0, 218);"></p>
                </b></div>
            <div>Average attendance of this class <b>
                    <p id="clsavg" style="display:inline-block"></p>
                </b></div>
        </section>
        <div id="table-con">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="center">Roll No.</th>
                            <th>Student Name</th>
                            <th class="center">Percentage</th>
                            <th class="center">Present</th>
                            <th class="center">Absent</th>
                            <th class="center">Status</th>
                        </tr>
                    </thead>

                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div id="saveBtnContainer">
                <button class="btn-save" id="btn-save">Save Attendance</button>
            </div>
        </div>
        <div id="alt-table-con"></div>
    </div>

    <div id="back" class="state-hide">
        <div id="pop-container">
            <!-- <a href="/teacher/teacher-home.html"> <i class="fa-solid fa-xmark" id="fea-cross-btn"></i></a> -->
            <i class="fa-solid fa-xmark" id="fea-cross-btn"></i>
            <p id="date">Attendance for <b>21.03.2026</b></p>
            <p id="teacher-name">Taken by <b>Tushar Shit</b></p>
            <p id="present">Total present 30</p>
            <p id="absent">Total absent 30</p>
        </div>
    </div>


    <div id="pageLoader">
        <div class="spinner"></div>
    </div>
    <script type="module" src="../js/attendance.js"></script>
</body>

</html>
