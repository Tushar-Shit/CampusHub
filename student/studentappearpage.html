<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="logo.jpeg">
    <link rel="icon" type="image/png" href="../image/websiteLogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Appear Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Playwrite+AT:ital,wght@0,100..400;1,100..400&family=Playwrite+NZ+Basic:wght@100..400&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap');
    </style>
    <link rel="stylesheet" href="../css/studentAppear.css">
</head>

<body background="../image/bgimage.png">
    <div id="main">

        <div id="left">
            <span id="userLogo"></span>

            <div id="userDetails">
                <span id="userName"></span>
                <span id="userEmail"></span>

                <div class="editable">
                    <span id="mobile"></span>
                    <input type="tel" placeholder="Enter Mobile Number..." class="editData">
                    <svg class="editIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
                    </svg>
                    <svg class="cancelIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                    <svg class="saveIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                </div>

                <span id="gender"></span>
                <span id="department"></span>
                <span id="collegeRoll"></span>

                <div class="editable">
                    <span id="semester"></span>
                    <input type="text" placeholder="Example I, II, III, IV, V, VI, VII, VIII" class="editData">
                    <svg class="editIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
                    </svg>
                    <svg class="cancelIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                    <svg class="saveIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                </div>

                <div class="editable">
                    <span id="universityRoll"></span>
                    <input type="text" placeholder="Enter University Roll..." class="editData">
                    <svg class="editIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
                    </svg>
                    <svg class="cancelIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                    <svg class="saveIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                </div>
                <span id="session"></span>
            </div>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
        <div id="right">
            <div id="rightTop">
                <div id="heading"></div>
                <div id="buttons">
                    <button id="feeStructureButton">Create Fees Structure</button>
                    <button id="applyForSemesterButton">Apply for Exam</button>
                </div>
            </div>
            <div id="rightBottom"></div>
        </div>
    </div>

    <div id="pageLoader">
        <div class="spinner"></div>
    </div>


    <script src="../js/studentappearpage.js"></script>
    <script type="module" src="../js/studentappearpagefirebase.js"></script>
</body>

</html>
