<!DOCTYPE html>
<html>

<head>
    <title>Exam Form</title>
    <link rel="icon" type="image/png" href="../image/websiteLogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/studentexamappearform.css">
</head>

<body>
    <form id="examForm">
        <h1>Semester Confirmation Form</h1>
        <label for="fullName">Student Name</label>
        <br>
        <input type="text" id="fullName" class="input" required>
        <br>

        <label>Select Department:</label>
        <div id="container-radio">
            <input type="radio" name="department" value="BCA" id="r-bca" required>
            <label for="r-bca" class="r-label">BCA</label>

            <input type="radio" name="department" value="BBA" id="r-bba">
            <label for="r-bba" class="r-label">BBA</label>

            <input type="radio" name="department" value="BHM" id="r-bhm">
            <label for="r-bhm" class="r-label">BHM</label>

            <input type="radio" name="department" value="BMLT" id="r-bmlt">
            <label for="r-bmlt" class="r-label">BMLT</label>
        </div>

        <label>Semester:</label>
        <select id="semester" required>
            <option value="">Select</option>
            <option value="I">1st Semester</option>
            <option value="II">2nd Semester</option>
            <option value="III">3rd Semester</option>
            <option value="IV">4th Semester</option>
            <option value="V">5th Semester</option>
            <option value="VI">6th Semester</option>
            <option value="VII">7th Semester</option>
            <option value="VIII">8th Semester</option>
        </select>

        <br>

        <label for="clgRoll">College Roll</label>
        <br>
        <input type="text" id="clgRoll" class="input" required>
        <br>
        <label for="uniRoll">University Roll</label>
        <br>
        <input type="text" id="uniRoll" class="input" required>
        <br>
        <label for="mobileNumber">Mobile Number</label>
        <br>
        <input type="text" id="mobileNumber" class="input" required>
        <button type="submit">Submit Application</button>
    </form>


    <div id="statusBox">
        <h2 style="justify-self: center;">Status</h2>
    </div>

    <div id="pageLoader">
        <div class="spinner"></div>
    </div>

    <button type="button" id="statusBtn">Check Status</button>

    <script type="module" src="../js/studentexamform.js"></script>
</body>

</html>
