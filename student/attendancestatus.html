<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Check</title>
    <link rel="stylesheet" href="../css/attendancestatus.css">
</head>

<body>
    <div id="ihgdtyh">
        <h1 class="heading">Check Attendance</h1>
        <span id="welcomeText"></span>
        <br><br><br>
        <div id="main-card">
            <div class="mobile-icon-container">
                <div id="mobile-icon"></div>
            </div>

            <div class="date">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    data-lucide="calendar" aria-hidden="true" class="lucide lucide-calendar w-4 h-4">
                    <path d="M8 2v4"></path>
                    <path d="M16 2v4"></path>
                    <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                    <path d="M3 10h18"></path>
                </svg>
                <span id="today-date"></span>
            </div>

            <h2 class="text-sm">Today's Status</h2>

            <div id="status-title"></div>
            <div id="status-message"></div>
        </div>

        <h3 class="heading" style="font-size: 40px;">This Semester's Summary</h3>

        <div class="cards">
            <!-- Stat Card 1 -->
            <div class="card-contents">
                <div class="card-content-logo calender">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        data-lucide="calendar" aria-hidden="true" class="lucide lucide-calendar w-7 h-7">
                        <path d="M8 2v4"></path>
                        <path d="M16 2v4"></path>
                        <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                        <path d="M3 10h18"></path>
                    </svg>
                </div>
                <div>
                    <p class="card-content-heading">Present</p>
                    <p class="card-content-text" id="totalPresent"></p>
                </div>
            </div>

            <!-- Stat Card 2 -->
            <div class="card-contents">
                <div class="card-content-logo user">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        data-lucide="user" aria-hidden="true" class="lucide lucide-user w-7 h-7">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div>
                    <p class="card-content-heading">Absent</p>
                    <p class="card-content-text" id="totalAbsent"></p>
                </div>
            </div>

            <!-- Stat Card 3 -->
            <div class="card-contents">
                <div class="card-content-logo success">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        data-lucide="check-circle" aria-hidden="true" class="lucide lucide-check-circle w-7 h-7">
                        <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
                        <path d="m9 11 3 3L22 4"></path>
                    </svg>
                </div>
                <div>
                    <p class="card-content-heading">Total Rate</p>
                    <p class="card-content-text" id="present"></p>
                </div>
            </div>
        </div>
    </div>


    <div id="pageLoader">
        <div class="spinner"></div>
    </div>

    <script type="module" src="../js/attendancestatus.js"></script>
</body>

</html>
